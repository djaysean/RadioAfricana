workflows:
  ios-simulator:
    name: Radio Africana iOS Simulator Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default
      node: 22.11.0

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Install CocoaPods dependencies
        script: |
          cd "$CM_BUILD_DIR/ios"
          pod install

      - name: Build iOS simulator app
        script: |
          xcodebuild build \
            -workspace "$CM_BUILD_DIR/ios/RadioAfricana.xcworkspace" \
            -scheme "RadioAfricana" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath "$CM_BUILD_DIR/build/ios/simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

    artifacts:
      - build/ios/simulator/**/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-app-store:
    name: Radio Africana iOS App Store Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic Radio Africana

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.radioafricana.radioafricana

      xcode: latest
      cocoapods: default
      node: 22.11.0

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Install CocoaPods dependencies
        script: |
          cd "$CM_BUILD_DIR/ios"
          pod install

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/RadioAfricana.xcworkspace" \
            --scheme "RadioAfricana"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log